# Public repos and their trivy checks: see home-infra-docs ADR 0022. Repo descriptions: home-infra-docs repositories.md.

# Public and CI-less: cross-repo reusable workflows need a public repo and run in the caller's context.
gha-common: {}

# "terraform / " prefix: GitHub names a reusable workflow's jobs after the caller job. See README.
dyndns:
  runner: true
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"

website:
  runner: true
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"

aws-budget:
  runner: true
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"

homeserver-health-check:
  runner: true
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"

ses-relay:
  runner: true
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"

home-infra:
  required_status_check_contexts:
    - "Validate"
  runner: true

repo-infra:
  required_status_check_contexts:
    - "trivy-config / Trivy config scan"

terraform-state:
  required_status_check_contexts:
    - "trivy-config / Trivy config scan"

k3s-bootstrap:
  required_status_check_contexts:
    - "trivy-config / Trivy config scan"

secrets-manager:
  visibility: public
  runner: true
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"

# Public after a full-history content audit: ADR 0022's 2026-10-10 addendum.
home-infra-docs:
  visibility: public
  required_status_check_contexts:
    - "gitleaks / Gitleaks secret scan"

# Private on purpose: issues name unfixed weaknesses and unrotated secrets.
home-infra-tracker:
  visibility: private
  branch_protection_enabled: false

# Archived, kept for its handovers. Unarchive before changing any setting below.
home-infra-ai-context:
  visibility: private
  branch_protection_enabled: false
  archived: true

k3s-apps:
  visibility: public
  runner: true
  # Prefixed, unlike its inline checks: the scan runs through gha-common's reusable workflow.
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
    - "trivy-config / Trivy config scan"

# Scheduled Renovate on GitHub-hosted runners; its apply role only reads the App credentials. Tracker #42.
renovate:
  # Off until the first push creates main; protection requires checks that can't exist before. Then removed.
  branch_protection_enabled: false
  required_status_check_contexts:
    - "Validate Renovate config"
    - "gitleaks / Gitleaks secret scan"

# GitHub-hosted CI only: no AWS, no runner, nothing to deploy.
terraform-provider-fritzbox:
  required_status_check_contexts:
    - "Go test"

# Private: a map of the home network. Free plan: private repos get no branch protection.
fritzbox:
  visibility: private
  branch_protection_enabled: false
