# Shared CI Dockerfile + two workflow_call reusable workflows
# (terraform-checks.yml, terraform-apply.yml) that dyndns/website/
# aws-budget/homeserver-health-check/ses-relay all call instead of each
# carrying its own near-duplicate checks.yml/apply.yml/Dockerfile. Public
# (required -- GitHub only allows cross-repo reusable workflows from a
# personal account when the workflow's own repo is public). No runner
# entry -- reusable-workflow jobs execute under the calling repo's own
# runner registration and vars/secrets context, nothing ever runs inside
# this repo itself. No required_status_check_contexts / action_variables
# either, for the same reason: it has no CI of its own.
gha-common: {}

# checks.yml/apply.yml call gha-common's reusable workflows (2026-09-03)
# -- see aws-budget's own comment for why these need the "terraform / "
# prefix.
dyndns:
  runner: true
  # trivy-config added 2026-09-14 once this repo's own findings were
  # actually fixed (PARKED.md's "Security audit" entry) rather than
  # left open -- confirmed clean on main first, same discipline as
  # terraform-state's own required-check addition.
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"
  action_variables:
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# Static CV/personal site at www.jkandler.de (S3 + CloudFront + ACM).
# Originally GitHub-hosted specifically to keep the deploy pipeline
# independent of home-network uptime. Switched to the self-hosted home
# runner on 2026-08-23 at the user's explicit request, after being shown
# that tradeoff directly: a homeserver outage now also blocks shipping a
# site fix, not just home services. See ADR 0016's Update section.
# checks.yml/apply.yml call gha-common's reusable workflows (2026-09-03)
# -- see aws-budget's own comment for why these need the "terraform / "
# prefix.
website:
  runner: true
  # trivy-config added 2026-09-14 once this repo's own findings were
  # actually fixed (PARKED.md's "Security audit" entry, including the
  # bucket-rename incident that entry documents in full) rather than
  # left open.
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"
  action_variables:
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# $10/month AWS Budget alert. Self-hosted runner, same as everything else
# now -- this repo's own apply.yml runs terraform apply directly, no
# separate deploy step. checks.yml/apply.yml call gha-common's reusable
# workflows from a job named "terraform" (2026-09-03) -- GitHub prefixes
# a reusable workflow's own nested job names with the caller job's id in
# every check-run/status-check context ("terraform / Validate", not just
# "Validate"), found live when this repo's first migration PR reported
# both checks green but GitHub still refused to merge it, still waiting
# on the un-prefixed names below that no run will ever report again.
aws-budget:
  runner: true
  # trivy-config added 2026-09-14 -- this repo was already confirmed
  # clean on its very first run (0 findings), nothing to fix.
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"
  action_variables:
    ALERT_EMAIL: julian.kandler@outlook.com

# External reachability check for the homeserver (Route53 health check +
# CloudWatch alarm + SNS email), deliberately the only monitoring piece
# that runs in AWS -- the rest is planned to run on the homeserver itself
# for cost reasons, but home-hosted monitoring can't alert about the home
# network itself being unreachable. checks.yml/apply.yml call gha-common's
# reusable workflows (2026-09-03) -- see aws-budget's own comment for why
# these need the "terraform / " prefix.
homeserver-health-check:
  runner: true
  # trivy-config added 2026-09-14 once this repo's own findings were
  # actually fixed (PARKED.md's "Security audit" entry -- a dedicated
  # us-east-1 KMS key for its SNS topic, since the shared workspace key
  # can't cross regions).
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"
  action_variables:
    ALERT_EMAIL: julian.kandler@outlook.com

# SES sending identity used only to relay homeserver monitoring alert
# emails (Alertmanager, in home-infra's monitoring role) to
# julian.kandler@outlook.com -- separate from homeserver-health-check on
# purpose, since that repo's own README says it's deliberately kept small
# and not meant to grow into a general-purpose AWS monitoring stack.
# checks.yml/apply.yml call gha-common's reusable workflows (2026-09-03)
# -- see aws-budget's own comment for why these need the "terraform / "
# prefix.
ses-relay:
  runner: true
  # trivy-config added 2026-09-14 once this repo's own findings were
  # actually fixed (PARKED.md's "Security audit" entry -- ses-relay-smtp's
  # policy moved to an IAM group).
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"
  action_variables:
    ALERT_EMAIL: julian.kandler@outlook.com
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# Started as a no-CI backup mirror like the ones below, but grew a real
# checks.yml (ansible-playbook --syntax-check + the unit test suite) since
# it's the most actively-developed repo in this workspace. Found live: its
# runs-on: [self-hosted, home, debian] has been queuing forever with no
# runner able to pick it up -- runner: true was never added here, so
# sync_github_runner_repositories.py never included it. That's since been
# fixed (runner: true below); made public with the same branch protection
# as every other public repo 2026-09-13, once its own content was checked
# for anything that would've been a blocker (no hardcoded secrets --
# AWS Secrets Manager now, not this repo -- and only private RFC1918
# addresses, not anything internet-routable). checks.yml's own trigger
# had to move from push to pull_request first (separate PR,
# home-infra#27) so the required "Validate" check actually fires against
# a PR, not only after it's already merged.
home-infra:
  required_status_check_contexts:
    - "Validate"
  runner: true

# Backup mirrors for repos that previously existed only on one laptop, with
# no other copy anywhere -- private, no CI, no branch protection. These are
# single-owner git history backups, not collaboratively-protected release
# repos: mandatory signed-commit PRs (repo-infra's normal baseline) would
# only make routine backup pushes painful here, for zero actual benefit
# (nothing runs CI against them, nobody else pushes to them). terraform-state
# is the exception below -- it grew a real CI check (trivy config) and
# standard branch protection once it had findings worth actually gating
# merges on, same reasoning as home-infra's own move above.

repo-infra:
  visibility: private
  branch_protection_enabled: false

# Standard branch protection enabled 2026-09-14, same block every public
# repo gets (required PR + signed commits + linear history + the named
# status check, 0 required approvals since single-maintainer) -- once this
# repo's own trivy findings were actually triaged/fixed rather than left
# open, so the required check means something instead of blocking every
# future PR unconditionally. See PARKED.md's "Security audit" entry for
# what got fixed vs. deliberately suppressed with a documented reason.
#
# Made public the same day, deliberately: GitHub's classic branch
# protection API requires a paid plan for private repositories (found
# live -- github_repository_environment.production applied fine,
# github_branch_protection then failed with "Upgrade to GitHub Pro or
# make this repository public"). A real tradeoff weighed explicitly, not
# a default -- this repo is the account's own IAM operator identity,
# KMS key, and CloudTrail config, so publishing it does expose the exact
# permission-boundary structure. Judged acceptable because none of that
# is a credential (every access key stays in `pass`/PGP-encrypted or
# human-only, never in git) and the self-escalation design this repo's
# own comments already document was built to hold up under scrutiny, not
# to depend on the policy shape staying secret.
terraform-state:
  required_status_check_contexts:
    - "trivy-config / Trivy config scan"

# The k3s cluster's own bootstrap root -- the self-hosted runner itself
# (modules/github_runner) plus the cluster-scoped PersistentVolumes a
# namespaced Role could never be scoped to by name (see k3s-apps' own
# split, 2026-09-03). Same category as repo-infra/terraform-state
# above: rare, admin-privileged, applied only locally by a human, never
# CI -- it's the thing k3s-apps' own CI runs on. Originally a second
# Terraform root nested inside the k3s-apps repo itself; extracted into
# its own repo here to actually live alongside its real siblings
# instead of inside the repo it grants access to.
k3s-bootstrap:
  visibility: private
  branch_protection_enabled: false

# The AWS Secrets Manager secret *containers*, migrated one at a time out
# of terraform-state (secrets_manager.tf) so the secrets concern is
# separable from the state-bucket bootstrap concern. Unlike the three
# roots above, this one does NOT actually share their self-escalation
# risk: it never touches IAM at all -- julian's own read/write grant on
# every secret lives entirely in terraform-state/operator.tf, deliberately
# kept out of this repo (see its own README, "IAM grants live in
# terraform-state, not here"). It only ever creates empty
# aws_secretsmanager_secret *containers* -- no GetSecretValue,
# PutSecretValue, or DeleteSecret anywhere in its Terraform. CI-applied
# 2026-09-13 via its own dedicated OIDC role (aws_policies.tf), scoped to
# exactly CreateSecret/DescribeSecret on the name prefixes it already
# manages -- a compromised run can create a bogus empty container at
# worst, never read or write an actual secret value.
#
# Public, deliberately, same reasoning and precedent as k3s-apps: classic
# branch protection rules need a paid plan for private repositories on
# GitHub (confirmed live 2026-09-13 -- github_branch_protection failed
# outright with "Upgrade to GitHub Pro or make this repository public").
# No real secret material ever touches this repo's git history either
# way (every aws_secretsmanager_secret resource is container-only) --
# only secret names/descriptions become publicly visible that weren't
# before, e.g. "Blocky's own Postgres query-log password".
secrets-manager:
  visibility: public
  runner: true
  # trivy-config added 2026-09-14 once this repo's own findings were
  # actually fixed -- all 12 AWS-0098s suppressed with a documented
  # reason (PARKED.md's "Security audit" entry / this repo's own
  # README.md).
  required_status_check_contexts:
    - "terraform / Validate"
    - "terraform / Terraform plan"
    - "trivy-config / Trivy config scan"

home-infra-docs:
  visibility: private
  branch_protection_enabled: false

home-infra-ai-context:
  visibility: private
  branch_protection_enabled: false

# The k3s cluster's own app workloads (Blocky, ingress, Grafana,
# home-agent, deluge, open-webui, landing-page, alertmanager) -- CI-
# applied (2026-09-03) via a narrowly-scoped in-cluster ServiceAccount
# (bootstrap/ in that repo, applied locally, owns the RBAC and the
# runner itself), gated on the production environment's reviewer
# approval before a real apply runs, same pattern as the AWS repos
# above. Public, deliberately, not the private visibility this repo
# had until now: GitHub's environment-reviewer protection needs a paid
# plan for private repositories, and real secret material never
# touches this repo's git history either way (SOPS-sourced, synced in
# via action_secrets below, landing only in GitHub Secrets) -- only
# its .tf files, which do describe real internal LAN topology (IPs,
# NFS paths, node names), become publicly visible that weren't before.
k3s-apps:
  visibility: public
  runner: true
  # trivy-config added 2026-09-14 once this repo's own findings were
  # actually fixed (PARKED.md's "Security audit" entry -- k3s-apps#52,
  # containers/sankey-export/Dockerfile's DS-0002/DS-0026). Named
  # "trivy-config / Trivy config scan" like every other repo's, not
  # un-prefixed like this repo's own Validate/Terraform plan above --
  # the prefix comes from security-scan.yml calling gha-common's
  # reusable workflow, regardless of how this repo's own inline
  # checks.yml happens to name its contexts.
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
    - "trivy-config / Trivy config scan"
