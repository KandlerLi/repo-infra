# Shared CI Dockerfile + two workflow_call reusable workflows
# (terraform-checks.yml, terraform-apply.yml) that dyndns/website/
# aws-budget/homeserver-health-check/ses-relay all call instead of each
# carrying its own near-duplicate checks.yml/apply.yml/Dockerfile. Public
# (required -- GitHub only allows cross-repo reusable workflows from a
# personal account when the workflow's own repo is public). No runner
# entry -- reusable-workflow jobs execute under the calling repo's own
# runner registration and vars/secrets context, nothing ever runs inside
# this repo itself. No required_status_check_contexts / action_variables
# either, for the same reason: it has no CI of its own.
gha-common: {}

dyndns:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# Static CV/personal site at www.jkandler.de (S3 + CloudFront + ACM).
# Originally GitHub-hosted specifically to keep the deploy pipeline
# independent of home-network uptime. Switched to the self-hosted home
# runner on 2026-08-23 at the user's explicit request, after being shown
# that tradeoff directly: a homeserver outage now also blocks shipping a
# site fix, not just home services. See ADR 0016's Update section.
website:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# $10/month AWS Budget alert. Self-hosted runner, same as everything else
# now -- this repo's own apply.yml runs terraform apply directly, no
# separate deploy step.
aws-budget:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ALERT_EMAIL: julian.kandler@outlook.com

# External reachability check for the homeserver (Route53 health check +
# CloudWatch alarm + SNS email), deliberately the only monitoring piece
# that runs in AWS -- the rest is planned to run on the homeserver itself
# for cost reasons, but home-hosted monitoring can't alert about the home
# network itself being unreachable.
homeserver-health-check:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ALERT_EMAIL: julian.kandler@outlook.com

# SES sending identity used only to relay homeserver monitoring alert
# emails (Alertmanager, in home-infra's monitoring role) to
# julian.kandler@outlook.com -- separate from homeserver-health-check on
# purpose, since that repo's own README says it's deliberately kept small
# and not meant to grow into a general-purpose AWS monitoring stack.
ses-relay:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ALERT_EMAIL: julian.kandler@outlook.com
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# Started as a no-CI backup mirror like the ones below, but grew a real
# checks.yml (ansible-playbook --syntax-check + the unit test suite) since
# it's the most actively-developed repo in this workspace. Found live: its
# runs-on: [self-hosted, home, debian] has been queuing forever with no
# runner able to pick it up -- runner: true was never added here, so
# sync_github_runner_repositories.py never included it. Still private/no
# branch protection, same single-owner-backup reasoning as the group below.
home-infra:
  visibility: private
  branch_protection_enabled: false
  runner: true

# Backup mirrors for repos that previously existed only on one laptop, with
# no other copy anywhere -- private, no CI, no branch protection. These are
# single-owner git history backups, not collaboratively-protected release
# repos: mandatory signed-commit PRs (repo-infra's normal baseline) would
# only make routine backup pushes painful here, for zero actual benefit
# (nothing runs CI against them, nobody else pushes to them).

repo-infra:
  visibility: private
  branch_protection_enabled: false

terraform-state:
  visibility: private
  branch_protection_enabled: false

home-infra-docs:
  visibility: private
  branch_protection_enabled: false

home-infra-ai-context:
  visibility: private
  branch_protection_enabled: false