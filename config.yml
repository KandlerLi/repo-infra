dyndns:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# Static CV/personal site at www.jkandler.de (S3 + CloudFront + ACM).
# Originally GitHub-hosted specifically to keep the deploy pipeline
# independent of home-network uptime. Switched to the self-hosted home
# runner on 2026-08-23 at the user's explicit request, after being shown
# that tradeoff directly: a homeserver outage now also blocks shipping a
# site fix, not just home services. See ADR 0016's Update section.
website:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ROUTE53_ZONE_ID: Z07879811I86VC8PAL8HX

# $10/month AWS Budget alert. Self-hosted runner, same as everything else
# now -- this repo's own apply.yml runs terraform apply directly, no
# separate deploy step.
aws-budget:
  runner: true
  required_status_check_contexts:
    - "Validate"
    - "Terraform plan"
  action_variables:
    ALERT_EMAIL: julian.kandler@outlook.com

# Backup mirrors for repos that previously existed only on one laptop, with
# no other copy anywhere -- private, no CI, no branch protection. These are
# single-owner git history backups, not collaboratively-protected release
# repos: mandatory signed-commit PRs (repo-infra's normal baseline) would
# only make routine backup pushes painful here, for zero actual benefit
# (nothing runs CI against them, nobody else pushes to them).
home-infra:
  visibility: private
  branch_protection_enabled: false

repo-infra:
  visibility: private
  branch_protection_enabled: false

terraform-state:
  visibility: private
  branch_protection_enabled: false

home-infra-docs:
  visibility: private
  branch_protection_enabled: false

home-infra-ai-context:
  visibility: private
  branch_protection_enabled: false